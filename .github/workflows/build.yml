# Сборка модуля под Windows, Linux и macOS + проверка загрузки.
# Выпуск: на GitHub Releases → Draft a new release, тег vX.Y.Z (= "version" в
# module.json) → Publish; сборка сама приложит к нему пакеты .bzmod.
#
# Закрытые репозитории: минуты macOS у GitHub дорогие, поэтому macOS
# собирается только по тегу выпуска. В открытых — на каждый push.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]   # выпуск, созданный на GitHub (Releases → Draft a new release)

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # linux — в контейнере с glibc 2.28, как у BreezeCAD; macos — Apple Silicon.
        include: ${{ fromJSON((github.event.repository.private && !startsWith(github.ref, 'refs/tags/')) && '[{"system":"linux","os":"ubuntu-latest","container":"almalinux:8"},{"system":"windows","os":"windows-latest","container":""}]' || '[{"system":"linux","os":"ubuntu-latest","container":"almalinux:8"},{"system":"windows","os":"windows-latest","container":""},{"system":"macos","os":"macos-15","container":""}]') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Tools (Linux container)
        if: matrix.system == 'linux'
        run: dnf install -y -q gcc gcc-c++ make cmake git

      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build
        run: cmake --build build --config Release

      - name: Check that the module loads
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: bzmod-${{ matrix.system }}
          path: build/packages/*.bzmod
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches module.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('module.json',encoding='utf-8'))['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::тег $GITHUB_REF_NAME, а в module.json версия $version"; exit 1; }

      - uses: actions/download-artifact@v4
        with: { pattern: bzmod-*, path: packages, merge-multiple: true }

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls packages/*.bzmod
          gh release upload "$GITHUB_REF_NAME" packages/*.bzmod --clobber
